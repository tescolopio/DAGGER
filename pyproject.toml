[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagger-control-plane"
version = "0.1.0"
description = "Local-first multi-agent orchestration control plane"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.4.0",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "aiosqlite>=0.20.0",
  "pydantic>=2.10.0",
  "tavily-python>=0.5.0",
  "apscheduler>=3.10.4,<4",
  "sqlalchemy>=2.0.36",
  "typer>=0.15.0",
  "httpx>=0.28.0",
  "pyyaml>=6.0.2",
  "watchfiles>=1.0.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.43",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[project.scripts]
dagger = "dagger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dagger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
